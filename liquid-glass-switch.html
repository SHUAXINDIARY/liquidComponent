<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liquid Glass Switch</title>
  <script>document.documentElement.classList.toggle('embed', new URLSearchParams(location.search).has('embed'));</script>
  <style>
    :root {
      color-scheme: light dark;
      font: 100%/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      --page: #f5f5f7;
      --surface: rgba(255, 255, 255, .72);
      --text: #1d1d1f;
      --secondary: #6e6e73;
      --tertiary: #86868b;
      --line: rgba(0, 0, 0, .1);
      --accent: #238636;
      --accent-soft: rgba(35, 134, 54, .12);
      --focus: rgba(0, 113, 227, .52);
      --shadow: 0 18px 50px rgba(0, 0, 0, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-width: 320px;
      color: var(--text);
      background: var(--page);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .topbar {
      position: sticky;
      z-index: 10;
      top: 0;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--page) 76%, transparent);
      -webkit-backdrop-filter: blur(20px) saturate(1.5);
      backdrop-filter: blur(20px) saturate(1.5);
    }
    .topbar-inner {
      width: min(1040px, calc(100% - 48px));
      height: 52px;
      margin-inline: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .back-link {
      display: inline-grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 50%;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 1.15rem;
      text-decoration: none;
      transition: transform .1s ease-out, background-color .2s ease;
    }
    .back-link:active { transform: scale(.94); }
    .back-link:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
    .brand {
      color: var(--secondary);
      font-size: .8125rem;
      font-weight: 600;
      letter-spacing: .01em;
    }
    .index-count {
      color: var(--tertiary);
      font-size: .75rem;
      font-variant-numeric: tabular-nums;
    }
    .page-shell {
      width: min(1040px, calc(100% - 48px));
      margin-inline: auto;
      padding: clamp(48px, 8vw, 86px) 0 56px;
    }
    .page-intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 360px);
      gap: clamp(32px, 7vw, 88px);
      align-items: end;
      margin-bottom: clamp(36px, 6vw, 58px);
    }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: .8125rem;
      font-weight: 600;
      letter-spacing: .01em;
    }
    h1 {
      max-width: 680px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      font-size: clamp(2.65rem, 6vw, 4.75rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -.035em;
    }
    .summary {
      margin: 0;
      color: var(--secondary);
      font-size: 1rem;
      line-height: 1.65;
    }
    .stage {
      width: 100%;
      height: clamp(390px, 58vw, 560px);
      min-height: 390px;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .7);
      border-radius: 8px;
      color: rgba(14, 35, 23, .08);
      background-image:
        linear-gradient(to right, currentColor 1px, transparent 1px),
        linear-gradient(to bottom, currentColor 1px, transparent 1px),
        radial-gradient(120% 100% at 10% 0%, #fbfdf9, #dce7e0);
      background-size: 24px 24px, 24px 24px, 100% 100%;
      background-position: 12px 12px, 12px 12px, 0 0;
      box-shadow: var(--shadow), inset 0 1px rgba(255, 255, 255, .72);
    }
    .stage-meta {
      position: absolute;
      top: 20px;
      right: 22px;
      left: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: rgba(18, 38, 27, .55);
      font-size: .6875rem;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .state {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .state::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34c759;
    }
    .state.is-off::before { background: #8e8e93; }
    .switch {
      width: 160px;
      height: 67px;
      position: relative;
      padding: 0;
      border: 0;
      border-radius: 33.5px;
      cursor: pointer;
      background: rgba(59, 191, 78, .933);
      transition: background-color .45s cubic-bezier(.22, 1, .36, 1);
      touch-action: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .switch[aria-checked="false"] { background: rgba(148, 148, 159, .467); }
    .switch:focus-visible { outline: 3px solid rgba(26, 105, 215, .55); outline-offset: 5px; }
    .thumb {
      width: 146px;
      height: 92px;
      position: absolute;
      left: 0;
      top: 50%;
      margin-left: -21.95px;
      border-radius: 46px;
      transform: translate(57.9px, -50%) scale(.65);
      transform-origin: center;
      background: rgb(255, 255, 255);
      /* SVG 滤镜读取滑块背后的内容，并按位移贴图制造折射。 */
      -webkit-backdrop-filter: url(#liquid-glass);
      backdrop-filter: url(#liquid-glass);
      box-shadow: 0 4px 22px rgba(0, 0, 0, .1);
      pointer-events: none;
    }
    .switch[aria-checked="false"] .thumb { transform: translate(0, -50%) scale(.65); }
    /* WebKit 暂不支持在 backdrop-filter 中引用 SVG，使用普通毛玻璃降级。 */
    .backdrop-filter-fallback .thumb {
      background: rgb(255, 255, 255);
      -webkit-backdrop-filter: blur(0) saturate(1);
      backdrop-filter: blur(0) saturate(1);
      transition: -webkit-backdrop-filter .26s ease, backdrop-filter .26s ease;
    }
    .backdrop-filter-fallback .switch.is-material-active .thumb {
      -webkit-backdrop-filter: blur(14px) saturate(1.45);
      backdrop-filter: blur(14px) saturate(1.45);
    }
    .embed .topbar,
    .embed .page-intro { display: none; }
    .embed .page-shell { width: 100%; padding: 0; }
    .embed .stage {
      min-height: 100vh;
      height: 100vh;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #101112;
        --surface: rgba(38, 39, 41, .76);
        --text: #f5f5f7;
        --secondary: #a1a1a6;
        --tertiary: #86868b;
        --line: rgba(255, 255, 255, .12);
        --accent: #52d769;
        --accent-soft: rgba(82, 215, 105, .14);
        --shadow: 0 22px 58px rgba(0, 0, 0, .32);
      }
      .stage { border-color: rgba(255, 255, 255, .1); }
    }
    @media (max-width: 680px) {
      .topbar-inner,
      .page-shell { width: min(100% - 28px, 620px); }
      .page-shell { padding-top: 48px; }
      .page-intro { grid-template-columns: 1fr; gap: 20px; }
      .stage { height: min(480px, calc(100vh - 230px)); min-height: 360px; }
      .embed .stage { height: 100vh; min-height: 100vh; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .topbar {
        background: var(--page);
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
    }
    @media (prefers-contrast: more) {
      .topbar, .stage { border-color: currentColor; }
      .summary { color: var(--text); }
    }
    @media (prefers-reduced-motion: reduce) {
      .switch,
      .back-link,
      .backdrop-filter-fallback .thumb { transition-duration: 0s; }
    }
  </style>

  <script>
    // 位移、材质和指针状态分开保存，拖拽中断动画时可以从当前画面继续。
    const userAgent = navigator.userAgent;
    const isWebKit = /AppleWebKit/.test(userAgent);
    const isDesktopChromium = /Chrome|Chromium|Edg|OPR/.test(userAgent) && !/iP(?:ad|hone|od)/.test(userAgent);
    const useBackdropFallback = isWebKit && !isDesktopChromium;
    document.documentElement.classList.toggle('backdrop-filter-fallback', useBackdropFallback);

    const control = document.querySelector('.switch');
    const thumb = control.querySelector('.thumb');
    const stateLabel = document.querySelector('.state');
    const displacement = document.querySelector('#glass-displacement');
    const travel = 57.9;
    let currentX = travel;
    let velocity = 0;
    let animationFrame = 0;
    let dragFrame = 0;
    let materialFrame = 0;
    let previousTime = 0;
    let currentScale = 0.65;
    let currentAlpha = 1;
    let currentDisplacement = 22.26064761799501;
    let pointerId = null;
    let pointerStartX = 0;
    let lastPointerX = 0;
    let lastPointerTime = 0;
    let pointerVelocity = 0;
    let dragTargetX = travel;
    let dragging = false;

    function renderThumb() {
      // 每帧都更新承载滤镜的元素，促使 Chromium 重新采样背景，避免直接移动缓存图层。
      thumb.style.transform = `translateX(${currentX}px) translateY(-50%) scale(${currentScale})`;
      thumb.style.backgroundColor = `rgba(255, 255, 255, ${currentAlpha})`;
      displacement.setAttribute('scale', currentDisplacement);
    }

    function animateMaterial(active) {
      // 按下时放大、降低白色遮罩并增强折射；释放后恢复实体滑块质感。
      cancelAnimationFrame(materialFrame);
      control.classList.toggle('is-material-active', active);
      const fromScale = currentScale;
      const fromAlpha = currentAlpha;
      const fromDisplacement = currentDisplacement;
      const targetScale = active ? 0.9 : 0.65;
      // Safari 交互时保留更多白色底色，以普通毛玻璃代替 SVG 液态折射。
      const targetAlpha = active ? (useBackdropFallback ? 0.32 : 0.098) : 1;
      const targetDisplacement = active ? 50.08645714048877 : 22.26064761799501;
      const start = performance.now();
      const duration = active ? 260 : 360;

      function frame(time) {
        const p = Math.min(1, (time - start) / duration);
        const eased = 1 - Math.pow(1 - p, 4);
        currentScale = fromScale + (targetScale - fromScale) * eased;
        currentAlpha = fromAlpha + (targetAlpha - fromAlpha) * eased;
        currentDisplacement = fromDisplacement + (targetDisplacement - fromDisplacement) * eased;
        renderThumb();
        if (p < 1) materialFrame = requestAnimationFrame(frame);
      }
      materialFrame = requestAnimationFrame(frame);
    }

    function animateTo(target) {
      cancelAnimationFrame(animationFrame);
      previousTime = 0;

      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        currentX = target;
        velocity = 0;
        renderThumb();
        return;
      }

      function step(time) {
        if (!previousTime) previousTime = time;
        const dt = Math.min((time - previousTime) / 1000, 1 / 30);
        previousTime = time;

        // 接近临界阻尼的弹簧：起步快，同时在约 400ms 内柔和收敛且不过度回弹。
        const stiffness = 310;
        const damping = 32;
        const acceleration = stiffness * (target - currentX) - damping * velocity;
        velocity += acceleration * dt;
        currentX += velocity * dt;
        renderThumb();

        if (Math.abs(target - currentX) > 0.015 || Math.abs(velocity) > 0.015) {
          animationFrame = requestAnimationFrame(step);
        } else {
          currentX = target;
          velocity = 0;
          renderThumb();
        }
      }

      animationFrame = requestAnimationFrame(step);
    }

    function setTrackProgress(progress) {
      // 拖拽期间根据滑块位置连续插值轨道颜色，松手后再交回 CSS 状态控制。
      const off = [148, 148, 159, 0.467];
      const on = [59, 191, 78, 0.933];
      const value = off.map((v, i) => v + (on[i] - v) * progress);
      control.style.backgroundColor = `rgba(${value[0]}, ${value[1]}, ${value[2]}, ${value[3]})`;
    }

    function followDragTarget() {
      if (dragFrame) return;
      let lastTime = 0;

      function frame(time) {
        const dt = lastTime ? Math.min((time - lastTime) / 1000, 1 / 30) : 1 / 60;
        lastTime = time;
        // 指数跟随使手感不受刷新率影响，并保留少量惯性感而不产生明显延迟。
        const follow = 1 - Math.exp(-28 * dt);
        currentX += (dragTargetX - currentX) * follow;
        setTrackProgress(currentX / travel);
        renderThumb();

        if (Math.abs(dragTargetX - currentX) > 0.05 && pointerId !== null) {
          dragFrame = requestAnimationFrame(frame);
        } else {
          currentX = dragTargetX;
          setTrackProgress(currentX / travel);
          renderThumb();
          dragFrame = 0;
        }
      }

      dragFrame = requestAnimationFrame(frame);
    }

    function settle(on) {
      // 统一提交最终状态，确保无障碍属性、轨道、位置和材质同步收敛。
      control.setAttribute('aria-checked', String(on));
      stateLabel.textContent = on ? 'On' : 'Off';
      stateLabel.classList.toggle('is-off', !on);
      control.style.backgroundColor = '';
      animateTo(on ? travel : 0);
      animateMaterial(false);
    }

    control.addEventListener('pointerdown', event => {
      // 仅跟踪首个指针，避免多点触控同时改写同一组拖拽状态。
      if (pointerId !== null) return;
      pointerId = event.pointerId;
      pointerStartX = lastPointerX = event.clientX;
      lastPointerTime = event.timeStamp;
      pointerVelocity = 0;
      dragTargetX = currentX;
      dragging = false;
      control.setPointerCapture(pointerId);
      cancelAnimationFrame(animationFrame);
      velocity = 0;
      animateMaterial(true);
    });

    control.addEventListener('pointermove', event => {
      if (event.pointerId !== pointerId) return;
      const now = event.timeStamp;
      const dt = Math.max(1, now - lastPointerTime);
      pointerVelocity = (event.clientX - lastPointerX) / dt;
      lastPointerX = event.clientX;
      lastPointerTime = now;
      if (Math.abs(event.clientX - pointerStartX) > 3) dragging = true;
      if (!dragging) return;

      const rect = control.getBoundingClientRect();
      // 滑块经过缩放且带负外边距，此值是关闭态下其视觉中心相对轨道左边的位置。
      const visualCenterAtZero = 51.0625;
      dragTargetX = Math.max(0, Math.min(travel, event.clientX - rect.left - visualCenterAtZero));
      followDragTarget();
    });

    control.addEventListener('pointerup', event => {
      if (event.pointerId !== pointerId) return;
      control.releasePointerCapture(pointerId);
      const wasOn = control.getAttribute('aria-checked') === 'true';
      // 将最近的拖拽速度外推 90ms，让快速甩动即使未过中点也能完成切换。
      const projected = dragTargetX + pointerVelocity * 90;
      const next = dragging ? projected >= travel / 2 : !wasOn;
      pointerId = null;
      cancelAnimationFrame(dragFrame);
      dragFrame = 0;
      settle(next);
    });

    control.addEventListener('pointercancel', event => {
      if (event.pointerId !== pointerId) return;
      pointerId = null;
      cancelAnimationFrame(dragFrame);
      dragFrame = 0;
      // 手势被系统取消时不切换状态，只回到操作前的开关位置。
      settle(control.getAttribute('aria-checked') === 'true');
    });

    control.addEventListener('click', event => {
      // 键盘激活会产生 detail 为 0 的 click；指针操作已由 pointerup 处理。
      if (event.detail !== 0) return;
      settle(control.getAttribute('aria-checked') !== 'true');
    });
